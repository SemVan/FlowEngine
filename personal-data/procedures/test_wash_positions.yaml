name: test_wash_positions
title: Тест крана промывки A
description: КП-ПРОКАЧКА → КП-ПРОМЫВКА → КП-ПРОКАЧКА. Нужен выполненный HOME. В конце
  мотор A отпускается, привязка теряется. Насосы не включаются.
version: 1
draft: false
parameters: {}
steps:
