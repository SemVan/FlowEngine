  axes:
  - A
- op: set_valve
  name: wash_valve
  position: КП-ПРОКАЧКА
- op: dwell
  seconds: 2.0
- op: set_valve
  name: wash_valve
  position: КП-ПРОМЫВКА
- op: dwell
  seconds: 2.0
- op: set_valve
  name: wash_valve
  position: КП-ПРОКАЧКА
- op: motors
  enabled: false
  axes:
  - A
- op: log
  message: тест A завершён, мотор отпущен; перед следующим движением нужен HOME
