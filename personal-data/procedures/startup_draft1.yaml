name: startup_draft1
title: Запуск
description: Черновик по таблице инженеров. COM-порт и baudrate берутся из активного
  профиля. Шаги идут последовательно; параллельная подготовка X/Y требует отдельной
  реализации. Замените пункты «Требуется настройка» после проверки на установке.
version: 1
draft: false
parameters: {}
steps:
- title: Кран промывки — найти ноль
  op: home_valve
  name: wash_valve
- title: Кран промывки → КП-ПРОКАЧКА
  op: require_setup
  message: Найти рабочее положение визуально и сохранить смещение от HOME. Затем заменить
    этот пункт шагом «Положение крана», выбрав нужное A/B. Проверить скорость и ускорение
    оси A в профиле.
- title: Кран обжимающей жидкости — найти ноль
  op: home_valve
  name: sheath_valve
- title: Кран обжимающей жидкости → КО-ПРОКАЧКА
  op: require_setup
  message: Сохранить визуально выбранное положение относительно HOME и заменить этот
    пункт шагом «Положение крана». Проверить скорость и ускорение оси B.
- title: Кран сэмплера — найти ноль
  op: home_valve
  name: sample_valve
- title: Кран сэмплера → КС-ПРОКАЧКА
  op: require_setup
  message: Завершить Home C на установке, сохранить рабочее смещение от HOME и заменить
    этот пункт шагом «Положение крана». Проверить скорость и ускорение C.
- title: Параллельно — насос суспензии в НС-MIN и насос обжима в НО-MIN
  op: require_setup
  message: Нужны разрешённая конфигурация кранов, выбор физических концов MIN, скорость
    и ускорение поиска, отход до рабочих положений. Текущий Home X/Y выполняется последовательно;
    независимый параллельный поиск ещё не реализован. move_multi не заменяет поиск
    концевиков.
- title: Насос промывки — проверка и измерение оборота
  op: require_setup
  message: Уточнить вход датчика U, разрешённую конфигурацию кранов, направление,
    скорость и ускорение. Реализовать поиск двух последовательных срабатываний с подсчётом
    шагов и сохранением результата.
