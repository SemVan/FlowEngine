# Runtime parameters — feedrate caps, timeouts, firmware expectations.

firmware:
  flavor: marlin
  features_required: []       # populate after inspecting this board's M115 response
  use_line_numbers: false  # first bring-up uses plain G-code; enable only after verification

transport:
  port: auto          # resolves USB CDC Marlin on Linux, macOS, or Windows
  baud: 115200        # value used successfully by the existing hardware prototype
  reconnect_attempts: 5
  reconnect_backoff_s: 1.0

timeouts:
  ok_default: 5.0
  move: 30.0
  homing: 60.0
  diagnostics: 3.0

motion:
  feedrate_cap: 3000.0
  jog_step_default: 1.0
  enabled: false              # diagnostics-only until the physical axis map is verified
  configure_firmware: false   # never send placeholder M92/M203 values on first connection

pressure:
  source: manual            # Phase 1 default — see docs/HARDWARE.md to switch
  units: kPa
