# Device map reconstructed from the firmware (M114/M503) and the prototype
# configuration in cytonator3000. Physical Monster8 sockets are documented in
# docs/HARDWARE.md. Motion stays interlocked until wiring is checked.

instrument_id: "cytonator-monster8"

axes:
  - marlin_axis: X
    name: sample_syringe
    kind: syringe_pump
    steps_per_unit: 80.0
    units: mm
    travel: 146.2508767
    home_direction: min
    feedrate_default: 1030.0
    feedrate_max: 1200.0
    notes: "Prototype name: Насос сэмплера; logical X, physical DRIVER0."

  - marlin_axis: Y
    name: sheath_syringe
    kind: syringe_pump
    steps_per_unit: 80.0
    units: mm
    travel: 321.31221
    home_direction: max
    feedrate_default: 1200.0
    feedrate_max: 1200.0
    notes: "Prototype name: Насос шифа; logical Y, physical DRIVER1. Prototype requested 2000 but firmware M203 caps it at 1200 mm/min."

  - marlin_axis: A
    name: wash_valve_axis
    kind: valve
    steps_per_unit: 80.0
    units: mm
    travel: 9.42227
    home_direction: max
    feedrate_default: 600.0
    feedrate_max: 1200.0
    notes: "Logical A, physical DRIVER3 / E0 socket."

  - marlin_axis: B
    name: sheath_valve_axis
    kind: valve
    steps_per_unit: 80.0
    units: mm
    travel: 12.81382
    home_direction: max
    feedrate_default: 600.0
    feedrate_max: 1200.0
    notes: "Logical B, physical DRIVER4 / E1 socket."

  - marlin_axis: C
    name: sample_valve_axis
    kind: valve
    steps_per_unit: 80.0
    units: mm
    travel: 10.1065
    home_direction: max
    feedrate_default: 600.0
    feedrate_max: 1200.0
    notes: "Logical C, physical DRIVER5 / E2 socket."

  - marlin_axis: U
    name: wash_peristaltic
    kind: peristaltic_pump
    steps_per_unit: 80.0
    units: mm
    travel: 36000.0
    home_direction: min
    feedrate_default: 1200.0
    feedrate_max: 1200.0
    endstop_channels_shared: false
    notes: "Logical U, physical DRIVER6 / E3 socket. Travel and volume require calibration."

valves:
  - name: wash_valve
    axis: A
    position_a: 0.0
    position_b: -9.42227
    home_position: A
  - name: sheath_valve
    axis: B
    position_a: 0.0
    position_b: -12.81382
    home_position: A
  - name: sample_valve
    axis: C
    position_a: 0.0
    position_b: -10.1065
    home_position: A

pumps:
  - name: sample_pump
    axis: X
    kind: syringe
    volume_per_unit_ul: 1.0  # placeholder: calibrate before volume-based control
  - name: sheath_pump
    axis: Y
    kind: syringe
    volume_per_unit_ul: 1.0  # placeholder: calibrate before volume-based control
  - name: wash_pump
    axis: U
    kind: peristaltic
    volume_per_unit_ul: 1.0  # placeholder: calibrate before volume-based control
