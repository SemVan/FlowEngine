# Device map — physical hardware → Marlin axes.
#
# IMPORTANT: every numeric field below is a PLACEHOLDER until bring-up.
# See docs/HARDWARE.md for the procedure to fill these in for your instrument.
#
# Marlin axis assignment for Monster8 MK2 (8 driver slots):
#   X  → autosampler X
#   Y  → autosampler Y
#   Z  → autosampler Z
#   E0 → sample syringe
#   E1 → sheath syringe
#   E2 → peristaltic wash pump
#   E3 → sample-line valve (2-pos)
#   E4 → sheath-line valve (2-pos)

instrument_id: "flowengine-dev-001"

axes:
  - marlin_axis: X
    name: autosampler_x
    kind: autosampler_axis
    steps_per_unit: 80.0       # TODO(hardware): set by linear-screw pitch
    units: mm
    travel: 200.0              # TODO(hardware): measure at bring-up
    home_direction: min
    feedrate_default: 600.0
    feedrate_max: 3000.0
    notes: "Wired-OR endstops at both ends; soft limit enforced in software."

  - marlin_axis: Y
    name: autosampler_y
    kind: autosampler_axis
    steps_per_unit: 80.0
    units: mm
    travel: 200.0
    home_direction: min
    feedrate_default: 600.0
    feedrate_max: 3000.0

  - marlin_axis: Z
    name: autosampler_z
    kind: autosampler_axis
    steps_per_unit: 400.0
    units: mm
    travel: 80.0
    home_direction: max        # Z-up → home at the top, away from samples
    feedrate_default: 300.0
    feedrate_max: 1200.0

  - marlin_axis: E0
    name: sample_syringe
    kind: syringe_pump
    steps_per_unit: 400.0      # TODO(hardware): leadscrew + driver microsteps
    units: mm
    travel: 60.0               # syringe stroke
    home_direction: min        # home at "empty"
    feedrate_default: 200.0
    feedrate_max: 800.0
    notes: "Two endstops wired-OR on one channel (top + bottom of stroke)."

  - marlin_axis: E1
    name: sheath_syringe
    kind: syringe_pump
    steps_per_unit: 400.0
    units: mm
    travel: 60.0
    home_direction: min
    feedrate_default: 200.0
    feedrate_max: 800.0

  - marlin_axis: E2
    name: wash_peristaltic
    kind: peristaltic_pump
    steps_per_unit: 17.78      # ≈ 6400 steps/rev / 360 deg
    units: deg
    travel: 36000.0            # ~100 rotations — soft cap, can be revised
    home_direction: min
    feedrate_default: 1800.0
    feedrate_max: 7200.0
    notes: "Encoder feedback. Phase 3 will use it to detect missed steps."

  - marlin_axis: E3
    name: sample_valve_axis
    kind: valve
    steps_per_unit: 17.78
    units: deg
    travel: 90.0               # 2-position rotor: 90° between A and B
    home_direction: min
    feedrate_default: 300.0
    feedrate_max: 900.0

  - marlin_axis: E4
    name: sheath_valve_axis
    kind: valve
    steps_per_unit: 17.78
    units: deg
    travel: 90.0
    home_direction: min
    feedrate_default: 300.0
    feedrate_max: 900.0

valves:
  - name: sample_valve
    axis: E3
    position_a: 0.0
    position_b: 90.0
    home_position: A
  - name: sheath_valve
    axis: E4
    position_a: 0.0
    position_b: 90.0
    home_position: A

pumps:
  - name: sample_pump
    axis: E0
    kind: syringe
    volume_per_unit_ul: 25.0   # TODO(hardware): depends on installed syringe
    syringe_volume_ul: 1000.0
  - name: sheath_pump
    axis: E1
    kind: syringe
    volume_per_unit_ul: 25.0
    syringe_volume_ul: 1000.0
  - name: wash_pump
    axis: E2
    kind: peristaltic
    volume_per_unit_ul: 0.001  # µL per axis degree — TODO(hardware): calibrate
    has_encoder: true

autosampler:
  name: autosampler
  x_axis: X
  y_axis: Y
  z_axis: Z
  safe_z: 60.0
