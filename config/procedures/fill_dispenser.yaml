name: fill_dispenser
description: "DRAFT EXAMPLE: valve 1 → position 1, valve 2 → position 1, pump 1 aspirates. Fill parameters with the real device names, signed travel and speed."
version: 1
draft: true
parameters:
  valve_1:
    type: string
    description: "Configured name of valve 1."
    default: null
  valve_2:
    type: string
    description: "Configured name of valve 2."
    default: null
  pump_1_axis:
    type: string
    description: "Controller axis currently assigned to pump 1."
    default: null
  pump_travel:
    type: number
    description: "Signed pump 1 aspiration travel; units depend on calibration."
    default: null
  pump_feedrate:
    type: number
    description: "Pump 1 aspiration feedrate."
    default: null
    minimum: 0.01
steps:
  - op: set_valve
    name: "${valve_1}"
    position: A
  - op: set_valve
    name: "${valve_2}"
    position: A
  - op: move
    axis: "${pump_1_axis}"
    by: "${pump_travel}"
    feedrate: "${pump_feedrate}"
  - op: checkpoint
    name: "dispenser filled"
