name: wash
description: "Run peristaltic wash through the tract. Valves to B."
version: 1
steps:
  - op: set_valve
    name: sample_valve
    position: B
  - op: set_valve
    name: sheath_valve
    position: B
  - op: move
    axis: E2
    by: 7200.0       # 20 rotations
    feedrate: 3600.0
  - op: dwell
    seconds: 3
  - op: log
    message: "wash complete"
