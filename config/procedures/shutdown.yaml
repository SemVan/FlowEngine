name: shutdown
description: "Park autosampler at safe Z, return valves to A, retract syringes."
version: 1
steps:
  - op: move
    axis: Z
    to: 0.0          # home_direction=max so 0 is the top (safe)
    feedrate: 300.0
  - op: set_valve
    name: sample_valve
    position: A
  - op: set_valve
    name: sheath_valve
    position: A
  - op: home
    axes: [E0, E1]
  - op: log
    message: "shutdown complete"
