name: shutdown
description: "Return all three valves to their home positions and home syringes."
version: 1
steps:
  - op: set_valve
    name: wash_valve
    position: A
  - op: set_valve
    name: sample_valve
    position: A
  - op: set_valve
    name: sheath_valve
    position: A
  - op: home
    axes: [X, Y]
  - op: log
    message: "shutdown complete"
