name: two_flows_timed_example
title: Два потока — скорости и время
description: >-
  Оба насоса работают весь этап одним совместным ходом. Скорости приводов
  задаются отдельно, время общее. Это мм/мин, расход в мкл ещё не измерен.
  Перед реальной подачей проверить направления и маршрут жидкости.
draft: true
parameters:
  speed_x:
    type: number
    description: Скорость X, мм/мин
    default: 120
    minimum: 1
    maximum: 1200
  speed_y:
    type: number
    description: Скорость Y, мм/мин
    default: 60
    minimum: 1
    maximum: 1200
  time_s:
    type: number
    description: Номинальное время подачи обоих насосов, с
    default: 2
    minimum: 0.1
    maximum: 60
steps:
  - op: require_reference
    axes: [X, Y]
  - op: move_multi_for
    title: Оба насоса весь этап, скорости отдельно
    seconds: ${time_s}
    axes:
      X:
        direction: 1
        feedrate: ${speed_x}
      Y:
        direction: -1
        feedrate: ${speed_y}
