name: prime_sheath
description: "Prime the sheath line via sheath syringe."
version: 1
steps:
  - op: home
    axes: [Y]
  - op: set_valve
    name: sheath_valve
    position: A
  - op: move
    axis: Y
    by: -40.0
    feedrate: 400.0
  - op: dwell
    seconds: 2
  - op: log
    message: "sheath line primed"
