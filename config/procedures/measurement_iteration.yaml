name: measurement_iteration
description: "DRAFT reusable iteration: intake, analysis delivery and wash."
version: 1
draft: true
parameters:
  sample_volume_ul: {type: number, default: 100.0, minimum: 0.1}
  sample_flow_ul_min: {type: number, default: 100.0, minimum: 0.1}
  sheath_volume_ul: {type: number, default: 500.0, minimum: 0.1}
  sheath_flow_ul_min: {type: number, default: 500.0, minimum: 0.1}
  wash_volume_ul: {type: number, default: 100.0, minimum: 0.1}
  wash_flow_ul_min: {type: number, default: 100.0, minimum: 0.1}
  acceleration: {type: number, default: 50.0, minimum: 0.1}
steps:
  - op: call
    procedure: sample_intake
    parameters: {sample_volume_ul: "${sample_volume_ul}", sample_flow_ul_min: "${sample_flow_ul_min}", sheath_volume_ul: "${sheath_volume_ul}", sheath_flow_ul_min: "${sheath_flow_ul_min}", acceleration: "${acceleration}"}
  - op: call
    procedure: analysis_delivery
    parameters: {sample_volume_ul: "${sample_volume_ul}", sample_flow_ul_min: "${sample_flow_ul_min}", sheath_volume_ul: "${sheath_volume_ul}", sheath_flow_ul_min: "${sheath_flow_ul_min}", acceleration: "${acceleration}"}
  - op: call
    procedure: wash
    parameters: {cuvette_volume_ul: "${wash_volume_ul}", cuvette_flow_ul_min: "${wash_flow_ul_min}", sampler_volume_ul: "${wash_volume_ul}", sampler_flow_ul_min: "${wash_flow_ul_min}", acceleration: "${acceleration}"}
