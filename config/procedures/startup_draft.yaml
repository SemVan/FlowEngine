name: startup_draft
title: Запуск
description: >-
  Черновик по таблице инженеров. COM-порт и baudrate берутся из активного профиля.
  Шаги идут последовательно; параллельная подготовка X/Y требует отдельной реализации.
  Замените пункты «Требуется настройка» после проверки на установке.
draft: true
steps:
  - op: home_valve
    title: Кран промывки — найти ноль
    name: wash_valve
  - op: require_setup
    title: Кран промывки → КП-ПРОКАЧКА
    message: >-
      Найти рабочее положение визуально и сохранить смещение от HOME.
      Затем заменить этот пункт шагом «Положение крана», выбрав нужное A/B.
      Проверить скорость и ускорение оси A в профиле.
  - op: home_valve
    title: Кран обжимающей жидкости — найти ноль
    name: sheath_valve
  - op: require_setup
    title: Кран обжимающей жидкости → КО-ПРОКАЧКА
    message: >-
      Сохранить визуально выбранное положение относительно HOME и заменить
      этот пункт шагом «Положение крана». Проверить скорость и ускорение оси B.
  - op: home_valve
    title: Кран сэмплера — найти ноль
    name: sample_valve
  - op: require_setup
    title: Кран сэмплера → КС-ПРОКАЧКА
    message: >-
      Завершить Home C на установке, сохранить рабочее смещение от HOME
      и заменить этот пункт шагом «Положение крана». Проверить скорость и ускорение C.
  - op: require_setup
    title: Параллельно — насос суспензии в НС-MIN и насос обжима в НО-MIN
    message: >-
      Нужны разрешённая конфигурация кранов, выбор физических концов MIN,
      скорость и ускорение поиска, отход до рабочих положений.
      Текущий Home X/Y выполняется последовательно; независимый параллельный
      поиск ещё не реализован. move_multi не заменяет поиск концевиков.
  - op: require_setup
    title: Насос промывки — проверка и измерение оборота
    message: >-
      Уточнить вход датчика U, разрешённую конфигурацию кранов, направление,
      скорость и ускорение. Реализовать поиск двух последовательных срабатываний
      с подсчётом шагов и сохранением результата.
