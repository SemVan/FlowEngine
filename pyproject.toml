[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowengine"
version = "0.1.0"
description = "Control software for a flow cytometer's fluidics tract via MKS Monster8 MK2 / Marlin G-code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FlowEngine contributors" }]
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyserial>=3.5",
  "pyserial-asyncio>=0.6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "structlog>=24.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
flowengine = "flowengine.__main__:main"

[tool.setuptools]
packages = [
  "flowengine",
  "flowengine.schemas",
  "flowengine.transport",
  "flowengine.hardware",
  "flowengine.hardware.homing",
  "flowengine.hardware.pressure",
  "flowengine.procedures",
  "flowengine.modes",
  "flowengine.experiments",
  "flowengine.api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
